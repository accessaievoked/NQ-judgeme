# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "aa49199f89941741bcd238f1efbde10a"
name = "judgeme-demo-app"
application_url = "https://localhost"
embedded = true

[access_scopes]
scopes = "write_products,read_orders,read_customers,write_files,read_discounts,write_discounts"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
topics = ["orders/paid"]
uri = "/webhooks/orders/paid"

  [[webhooks.subscriptions]]
topics = ["orders/fulfilled"]
uri = "/webhooks/orders/fulfilled"

[app_proxy]
url = "https://localhost/apps/reviews"
subpath = "reviews"
prefix = "apps"

[auth]
redirect_urls = [ "https://localhost/api/auth" ]

[build]
automatically_update_urls_on_dev = true
